<!--
  ─────────────────────────────────────────────────────────────────────────
  bactriana.org — splash page.

  A doorway, nothing more. Two destinations, no navigation, no subpages.
  Content lives at jamespickett.info and courses.bactriana.org.
  /sandbox/ is deliberately unlinked.

  IMAGE CREDITS
    Left  — the Poi Kalyan ensemble, Bukhara. Photograph by James Pickett,
            rendered as watercolor using Google Gemini (Nano Banana 2). The
            composition and content are photographic; the rendering is
            generative.
    Right — Eurasia. Watercolor generated with Google Gemini (Nano Banana 2).

  Design follows jamespickett.info. Built with the assistance of Claude Opus 5.
  ─────────────────────────────────────────────────────────────────────────
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bactriana</title>
<meta name="description" content="Digital projects and course materials of James Pickett, historian of Islam and empire in Eurasia.">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="wordmark">Bactriana</h1>

<main class="doors">

  <a class="door" href="https://jamespickett.info/">
    <img src="bukhara-dusk-1200.webp"
         srcset="bukhara-dusk-700.webp 700w, bukhara-dusk-1200.webp 1200w"
         sizes="(max-width: 820px) 100vw, 50vw"
         alt="The Kalyan minaret and mosque, Bukhara"
         width="1200" height="800" decoding="async">
    <span class="veil"></span>
    <span class="label">
      <span class="name">Personal Website</span>
      <span class="addr">jamespickett.info</span>
    </span>
  </a>

  <a class="door" href="https://courses.bactriana.org/">
    <img src="eurasia-map-1200.webp"
         srcset="eurasia-map-700.webp 700w, eurasia-map-1200.webp 1200w"
         sizes="(max-width: 820px) 100vw, 50vw"
         alt="Watercolor map of Eurasia"
         width="1200" height="800" decoding="async">
    <span class="veil"></span>
    <span class="label">
      <span class="name">Course Websites</span>
      <span class="addr">courses.bactriana.org</span>
    </span>
  </a>

</main>

</body>
</html>
